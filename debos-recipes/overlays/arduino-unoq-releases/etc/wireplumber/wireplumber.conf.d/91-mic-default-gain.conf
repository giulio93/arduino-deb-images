# The "Headset" UCM device (Qualcomm/qcm2290/Headphones.conf) declares
# TX_DEC0 Volume should be 80 (-4dB) for the "Built-in Audio Headset
# microphone" capture route, but nothing in the UCM/ALSA/WirePlumber
# startup path actually applies that value. WirePlumber falls back to its
# own "device.routes.default-source-volume" setting for any input route
# with no previously-stored preference -- and that setting's shipped
# default is 1.0 (i.e. the route's raw hardware maximum, 124 / +40dB on
# this control's scale), which clips the mic signal into unusable noise.
#
# Confirmed on-device with a fully cleared WirePlumber state (no stored
# route preference at all): overriding this setting alone is sufficient
# to bring TX_DEC0 Volume up at exactly 80 on every start, with no
# script, no systemd unit, and no per-board provisioning step needed.
#
# 0.006331 is WirePlumber's internal linear-amplitude representation
# (the same value it stores in its own "channelVolumes" state) that maps
# to this control's raw hardware value 80 -- found empirically via
# `wpctl set-volume`, not derived from a documented formula.
wireplumber.settings = {
  device.routes.default-source-volume = 0.006331
}
