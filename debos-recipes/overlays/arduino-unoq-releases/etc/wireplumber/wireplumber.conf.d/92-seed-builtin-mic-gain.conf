# Register device/seed-builtin-mic-gain.lua (installed under
# /usr/local/share/wireplumber/scripts/device/, since WirePlumber's Lua
# script loader only searches XDG data directories, not /etc) and wire it
# into the existing "policy.device.routes" component group via a merge
# rule -- simply declaring a component here is not enough on its own,
# nothing "wants" it unless something requires/wants its "provides" name.
wireplumber.components = [
  {
    name = device/seed-builtin-mic-gain.lua, type = script/lua
    provides = custom.seed-builtin-mic-gain
  }
]

wireplumber.components.rules = [
  {
    matches = [
      { provides = "policy.device.routes" }
    ]
    actions = {
      merge = {
        wants = [ custom.seed-builtin-mic-gain ]
      }
    }
  }
]
